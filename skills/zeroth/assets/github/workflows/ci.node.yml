name: verify

on:
  push:
  pull_request:

# Node / JS-TS quality gate (starter). Adjust scripts to your package manager.
# Supply-chain hardening: installs with --ignore-scripts and expects a committed lockfile. For
# stricter builds, pin tool versions instead of `npx --yes`, and pin each action to a commit SHA.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: fmt + lint
        run: npx --yes @biomejs/biome check .
      - name: typecheck
        run: npx --yes tsc --noEmit || echo "add a tsconfig to enable typecheck"
      - name: test + coverage
        run: npx --yes vitest run --coverage || echo "add tests to enable this gate"
      - name: coverage upload
        if: ${{ hashFiles('coverage/**') != '' }}
        uses: codecov/codecov-action@v5
