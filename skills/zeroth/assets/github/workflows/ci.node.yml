name: verify

on:
  push:
  pull_request:

# Node / JS-TS quality gate (starter). Adjust scripts to your package manager.
# Verbs: fmt+lint=biome check, typecheck=tsc --noEmit, test+coverage=vitest, build=your build script.
# Optional next steps: arch (dependency-cruiser), deadcode (knip), mutation (stryker, nightly).
# Supply-chain hardening: actions are pinned to commit SHAs (dependabot keeps them fresh); installs
# with --ignore-scripts and expect a committed lockfile. For stricter builds, also pin tool versions.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"
      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: fmt + lint
        run: npx --yes @biomejs/biome check .
      - name: typecheck
        run: npx --yes tsc --noEmit || echo "add a tsconfig to enable typecheck"
      - name: test + coverage
        run: npx --yes vitest run --coverage || echo "add tests to enable this gate"
      - name: build
        run: npm run build --if-present
      # coverage upload: bind your sink (Codecov, Coveralls, SonarQube, or self-hosted). Example:
      # - name: coverage upload
      #   if: ${{ hashFiles('coverage/**') != '' }}
      #   uses: codecov/codecov-action@v5
