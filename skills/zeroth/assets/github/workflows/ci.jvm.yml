name: verify

on:
  push:
  pull_request:

# JVM quality gate (starter). Assumes Gradle with the wrapper (`./gradlew`).
# Gradle's `build` task runs the whole gate when the usual plugins are applied: fmt (spotless),
# lint (checkstyle/detekt), typecheck (javac, part of compile), test, and coverage (JaCoCo/Kover).
# For Maven, replace the build step with `mvn -B verify` (bind Spotless + tests + JaCoCo to `verify`).
# Supply-chain hardening: actions are pinned to commit SHAs (dependabot keeps them fresh). Commit and
# pin the Gradle wrapper too.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: build (fmt, lint, typecheck, test, coverage)
        run: ./gradlew build --no-daemon
      # coverage upload: bind your sink (Codecov, Coveralls, SonarQube, or self-hosted). Example:
      # - name: coverage upload
      #   if: ${{ hashFiles('**/build/reports/jacoco/**/*.xml', '**/build/reports/kover/**/*.xml') != '' }}
      #   uses: codecov/codecov-action@v5
