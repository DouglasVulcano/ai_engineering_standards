name: verify

on:
  push:
  pull_request:

# Rust quality gate (starter). Tighten as the codebase matures.
# Verbs: fmt=cargo fmt --check, lint=cargo clippy -D warnings, typecheck=(cargo check, via build),
# test=cargo test, build=cargo build --release. Optional next steps: coverage (cargo-llvm-cov),
# deadcode (cargo-machete), dependency policy (cargo-deny).
# Supply-chain hardening: actions are pinned to commit SHAs (dependabot keeps them fresh). Pin the
# toolchain and tool versions too. (dtolnay/rust-toolchain@stable is a channel ref, left unpinned.)
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features
      - name: build
        run: cargo build --release
