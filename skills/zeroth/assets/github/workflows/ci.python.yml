name: verify

on:
  push:
  pull_request:

# Python quality gate (starter). Tighten as the codebase matures.
# Supply-chain hardening: actions are pinned to commit SHAs (dependabot keeps them fresh). For stricter
# builds, pin tool versions too (and hashes via a requirements file).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Install tools
        run: pip install ruff mypy pytest pytest-cov
      - name: fmt
        run: ruff format --check .
      - name: lint
        run: ruff check .
      - name: typecheck
        run: mypy . || true   # remove "|| true" once the codebase is typed
      - name: test + coverage
        run: pytest --cov --cov-report=xml
      # coverage upload: bind your sink (Codecov, Coveralls, SonarQube, or self-hosted). Example:
      # - name: coverage upload
      #   if: ${{ hashFiles('coverage.xml') != '' }}
      #   uses: codecov/codecov-action@v5
      #   with:
      #     files: coverage.xml
